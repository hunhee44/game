<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>공룡 점프 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f7f7f7;
            user-select: none;
        }

        h1 { color: #333; margin-bottom: 5px; }

        #score-board {
            font-size: 1.2rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }

        .game-container {
            position: relative;
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        canvas {
            display: block;
            border-bottom: 2px solid #535353;
            background-color: #fafafa;
        }

        .controls {
            display: flex;
            gap: 12px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s ease;
        }

        #reset-btn { background-color: #4caf50; box-shadow: 0 4px 0 #388e3c; }
        .home-btn { background-color: #722ed1; box-shadow: 0 4px 0 #531dab; }
        .btn:active { transform: translateY(2px); }

        .guide {
            margin-top: 10px;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>🦖 공룡 점프 게임</h1>
    <div id="score-board">Score: <span id="score">0</span> | High: <span id="high-score">0</span></div>

    <div class="game-container">
        <canvas id="gameCanvas" width="600" height="200"></canvas>
    </div>

    <p class="guide">💡 <b>스페이스바</b> 또는 <b>화면 터치</b>로 점프!</p>

    <div class="controls">
        <button id="reset-btn" class="btn" onclick="restartGame()">다시시작</button>
        <a href="index.html" class="btn home-btn">메인으로</a>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('high-score');

        let score = 0;
        let highScore = localStorage.getItem('dino_high_score') || 0;
        highScoreEl.textContent = highScore;

        let gameSpeed = 5;
        let gravity = 0.6;
        let isGameOver = false;
        let animationFrameId;
        let frameCount = 0;

        // 디테일해진 T-Rex 공룡 객체
        const dino = {
            x: 50,
            y: 150,
            width: 38,
            height: 42,
            dy: 0,
            jumpForce: -11,
            isGrounded: true,
            
            draw() {
                ctx.fillStyle = '#535353';
                const x = this.x;
                const y = this.y;

                // 1. 머리 및 입
                ctx.fillRect(x + 16, y, 20, 14);       // 머리 상단
                ctx.fillRect(x + 22, y + 6, 16, 6);     // 주둥이
                
                // 눈 (하얀 점)
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(x + 20, y + 3, 3, 3);
                ctx.fillStyle = '#535353';

                // 2. 목 & 몸통
                ctx.fillRect(x + 12, y + 10, 16, 12);  // 목
                ctx.fillRect(x + 6, y + 18, 22, 16);   // 몸통

                // 3. 꼬리
                ctx.fillRect(x, y + 20, 8, 8);
                ctx.fillRect(x - 4, y + 22, 6, 4);

                // 4. 귀여운 앞발
                ctx.fillRect(x + 26, y + 22, 6, 3);

                // 5. 다리 (달리기 애니메이션)
                if (!this.isGrounded) {
                    // 점프 중일 때 (다리 오므리기)
                    ctx.fillRect(x + 8, y + 34, 5, 8);
                    ctx.fillRect(x + 18, y + 34, 5, 8);
                } else {
                    // 교차하며 달리기 효과
                    const legFrame = Math.floor(frameCount / 6) % 2;
                    if (legFrame === 0) {
                        ctx.fillRect(x + 8, y + 34, 5, 8);  // 왼다리 내림
                        ctx.fillRect(x + 18, y + 34, 5, 4); // 오른다리 올림
                    } else {
                        ctx.fillRect(x + 8, y + 34, 5, 4);  // 왼다리 올림
                        ctx.fillRect(x + 18, y + 34, 5, 8); // 오른다리 내림
                    }
                }
            },
            jump() {
                if (this.isGrounded && !isGameOver) {
                    this.dy = this.jumpForce;
                    this.isGrounded = false;
                }
            },
            update() {
                this.dy += gravity;
                this.y += this.dy;

                // 바닥 착지 판정
                if (this.y + this.height >= 190) {
                    this.y = 190 - this.height;
                    this.dy = 0;
                    this.isGrounded = true;
                }
                this.draw();
            }
        };

        // 장애물(선인장) 배열 및 생성
        let cacti = [];
        let spawnTimer = 0;

        function spawnCactus() {
            spawnTimer++;
            if (spawnTimer > Math.max(50, 100 - Math.floor(score / 50))) {
                const height = 30 + Math.random() * 20;
                cacti.push({
                    x: canvas.width,
                    y: 190 - height,
                    width: 16 + Math.random() * 8,
                    height: height
                });
                spawnTimer = 0;
            }
        }

        function updateCacti() {
            for (let i = cacti.length - 1; i >= 0; i--) {
                let c = cacti[i];
                c.x -= gameSpeed;

                // 선인장 디테일 그리기
                ctx.fillStyle = '#2e7d32';
                ctx.fillRect(c.x, c.y, c.width, c.height); // 줄기
                ctx.fillRect(c.x - 4, c.y + 10, 4, 10);     // 왼쪽 가지
                ctx.fillRect(c.x - 4, c.y + 10, 8, 3);
                ctx.fillRect(c.x + c.width, c.y + 14, 4, 10); // 오른쪽 가지
                ctx.fillRect(c.x + c.width - 4, c.y + 14, 8, 3);

                // 충돌 감지
                if (
                    dino.x < c.x + c.width &&
                    dino.x + dino.width > c.x &&
                    dino.y < c.y + c.height &&
                    dino.y + dino.height > c.y
                ) {
                    gameOver();
                }

                if (c.x + c.width < -10) {
                    cacti.splice(i, 1);
                }
            }
        }

        // 구름 배경 효과
        let clouds = [];
        function updateClouds() {
            if (Math.random() < 0.01) {
                clouds.push({ x: canvas.width, y: 20 + Math.random() * 50, speed: 1 + Math.random() });
            }
            ctx.fillStyle = '#dcdcdc';
            for (let i = clouds.length - 1; i >= 0; i--) {
                let cl = clouds[i];
                cl.x -= cl.speed;
                ctx.fillRect(cl.x, cl.y, 35, 12);
                ctx.fillRect(cl.x + 8, cl.y - 5, 18, 8);
                if (cl.x < -40) clouds.splice(i, 1);
            }
        }

        function gameLoop() {
            if (isGameOver) return;

            frameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 바닥선
            ctx.strokeStyle = '#535353';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, 190);
            ctx.lineTo(canvas.width, 190);
            ctx.stroke();

            updateClouds();
            dino.update();
            spawnCactus();
            updateCacti();

            // 점수 및 속도 증가
            score++;
            scoreEl.textContent = Math.floor(score / 5);
            gameSpeed = 5 + Math.floor(score / 200) * 0.5;

            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);

            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);
            ctx.font = '16px Arial';
            ctx.fillText('스페이스바/클릭으로 재시작', canvas.width / 2, canvas.height / 2 + 20);

            const finalScore = Math.floor(score / 5);
            if (finalScore > highScore) {
                highScore = finalScore;
                localStorage.setItem('dino_high_score', highScore);
                highScoreEl.textContent = highScore;
            }
        }

        function restartGame() {
            score = 0;
            frameCount = 0;
            gameSpeed = 5;
            cacti = [];
            clouds = [];
            isGameOver = false;
            dino.y = 150;
            dino.dy = 0;
            dino.isGrounded = true;
            cancelAnimationFrame(animationFrameId);
            gameLoop();
        }

        // 이벤트 리스너
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isGameOver) restartGame();
                else dino.jump();
            }
        });

        canvas.addEventListener('click', () => {
            if (isGameOver) restartGame();
            else dino.jump();
        });

        // 게임 시작
        gameLoop();
    </script>
</body>
</html>
