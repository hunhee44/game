<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>공룡 달리기</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
            -webkit-user-select: none;
        }
        #score {
            font-size: 28px;
            font-weight: bold;
            color: #535353;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        canvas {
            background-color: #ffffff;
            border-bottom: 3px solid #535353;
            box-shadow: 0 6px 12px rgba(0,0,0,0.08);
            max-width: 95vw;
            border-radius: 4px;
        }
        #game-over-panel {
            display: none;
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            font-weight: bold;
            color: #535353;
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 20px 30px;
            border-radius: 8px;
            border: 2px solid #535353;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .instruction {
            margin-top: 15px;
            color: #888;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="score">00000</div>
    
    <canvas id="gameCanvas" width="600" height="200"></canvas>

    <div id="game-over-panel">
        G A M E  O V E R<br>
        <span style="font-size:14px; color:#888; display:inline-block; margin-top:10px;">터치,스페이스바를 눌러 재시작</span>
    </div>

    <div class="instruction">스페이스바,화면 터치</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreDisplay = document.getElementById("score");
        const gameOverPanel = document.getElementById("game-over-panel");

        let score = 0;
        let isGameOver = false;
        let gameSpeed = 5;
        let cactuses = [];
        let nextSpawnDistance = 0;
        
        // 공룡 오브젝트
        const dino = {
            x: 50,
            y: 160,
            width: 40,
            height: 40,
            velocityY: 0,
            gravity: 0.6,
            jumpStrength: -11,
            isJumping: false,
            
            draw() {
                ctx.fillStyle = "#535353";
                
                // 머리와 턱
                ctx.fillRect(this.x + 20, this.y, 20, 16);
                ctx.fillRect(this.x + 20, this.y + 12, 14, 4);
                // 눈
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(this.x + 24, this.y + 4, 4, 4);
                
                // 몸통과 꼬리
                ctx.fillStyle = "#535353";
                ctx.fillRect(this.x + 4, this.y + 12, 20, 20);
                ctx.fillRect(this.x, this.y + 16, 4, 12);
                ctx.fillRect(this.x + 4, this.y + 28, 4, 4);
                
                // 팔
                ctx.fillRect(this.x + 24, this.y + 20, 6, 4);
                
                // 다리
                ctx.fillRect(this.x + 8, this.y + 32, 4, 8);
                ctx.fillRect(this.x + 18, this.y + 32, 4, 8);
            },
            jump() {
                if (!this.isJumping && !isGameOver) {
                    this.velocityY = this.jumpStrength;
                    this.isJumping = true;
                }
            },
            update() {
                this.velocityY += this.gravity;
                this.y += this.velocityY;

                if (this.y >= 160) {
                    this.y = 160;
                    this.velocityY = 0;
                    this.isJumping = false;
                }
            }
        };

        // 다양해진 선인장 클래스
        class Cactus {
            constructor(x, type) {
                this.x = x;
                this.type = type; // 'small', 'medium', 'large'
                
                if (type === 'small') {
                    this.width = 18;
                    this.height = 32;
                } else if (type === 'medium') {
                    this.width = 25;
                    this.height = 44;
                } else { // 'large'
                    this.width = 34;
                    this.height = 55;
                }
                
                this.y = 200 - this.height; // 바닥 높이에 맞춰 배치
            }

            draw() {
                ctx.fillStyle = "#535353";
                const scale = this.height / 50; // 기본 50px 기준 스케일 계산

                // 중앙 기둥
                const mainWidth = Math.max(4, 8 * scale);
                const mainX = this.x + (this.width - mainWidth) / 2;
                ctx.fillRect(mainX, this.y, mainWidth, this.height);

                // 왼쪽 가지
                const leftArmY = this.y + this.height * 0.3;
                const leftArmH = Math.max(4, 8 * scale);
                ctx.fillRect(this.x, leftArmY, mainX - this.x, leftArmH);
                ctx.fillRect(this.x, leftArmY - (10 * scale), Math.max(3, 4 * scale), 10 * scale);

                // 오른쪽 가지
                const rightArmY = this.y + this.height * 0.45;
                const rightArmH = Math.max(4, 8 * scale);
                ctx.fillRect(mainX + mainWidth, rightArmY, (this.x + this.width) - (mainX + mainWidth), rightArmH);
                ctx.fillRect(this.x + this.width - Math.max(3, 4 * scale), rightArmY - (12 * scale), Math.max(3, 4 * scale), 12 * scale);
            }

            update() {
                this.x -= gameSpeed;
            }
        }

        // 선인장 생성 관리 함수
        function handleCactuses() {
            if (cactuses.length === 0) {
                spawnCactus(canvas.width + 100);
            } else {
                const lastCactus = cactuses[cactuses.length - 1];
                if (canvas.width - lastCactus.x >= nextSpawnDistance) {
                    spawnCactus(canvas.width);
                }
            }

            for (let i = cactuses.length - 1; i >= 0; i--) {
                cactuses[i].update();
                cactuses[i].draw();

                // 화면 밖으로 지나간 선인장 제거
                if (cactuses[i].x < -cactuses[i].width) {
                    cactuses.splice(i, 1);
                }
            }
        }

        function spawnCactus(xPos) {
            const types = ['small', 'medium', 'large'];
            const randomType = types[Math.floor(Math.random() * types.length)];
            cactuses.push(new Cactus(xPos, randomType));
            
            // 다음 장애물과의 최소/최대 거리 설정 (속도에 비례)
            nextSpawnDistance = 200 + Math.random() * 200 + (gameSpeed * 10);
        }

        // 땅 무늬
        function drawGround() {
            ctx.strokeStyle = "#535353";
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            ctx.moveTo(0, 199);
            ctx.lineTo(canvas.width, 199);
            ctx.stroke();
            
            ctx.fillStyle = "#e0e0e0";
            ctx.fillRect(100, 192, 10, 2);
            ctx.fillRect(350, 195, 15, 2);
            ctx.fillRect(500, 191, 5, 2);
        }

        // 충돌 체크 (AABB)
        function checkCollision() {
            for (let cactus of cactuses) {
                if (
                    dino.x < cactus.x + cactus.width &&
                    dino.x + dino.width > cactus.x &&
                    dino.y < cactus.y + cactus.height &&
                    dino.y + dino.height > cactus.y
                ) {
                    endGame();
                    break;
                }
            }
        }

        // 게임 루프
        function gameLoop() {
            if (isGameOver) return;

            // 1. 화면 비우기
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 2. 오브젝트 업데이트 및 그리기
            drawGround();
            dino.update();
            dino.draw();
            
            handleCactuses();

            // 3. 충돌 검사
            checkCollision();

            // 점수 및 속도 조절
            score++;
            let paddedScore = String(Math.floor(score / 5)).padStart(5, '0');
            scoreDisplay.textContent = paddedScore;

            if (score % 500 === 0 && gameSpeed < 12) {
                gameSpeed += 0.5;
            }

            requestAnimationFrame(gameLoop);
        }

        // 게임 시작 및 재시작
        function startGame() {
            isGameOver = false;
            score = 0;
            gameSpeed = 6;
            cactuses = [];
            dino.y = 160;
            dino.velocityY = 0;
            dino.isJumping = false;
            gameOverPanel.style.display = "none";
            
            gameLoop();
        }

        // 게임 오버
        function endGame() {
            isGameOver = true;
            gameOverPanel.style.display = "block";
        }

        // 키보드 컨트롤
        window.addEventListener("keydown", (e) => {
            if (e.code === "Space") {
                e.preventDefault();
                if (isGameOver) startGame();
                else dino.jump();
            }
        });

        // 터치 컨트롤
        window.addEventListener("touchstart", (e) => {
            if (isGameOver) startGame();
            else dino.jump();
        });

        // 최초 실행
        startGame();
    </script>
</body>
</html>
