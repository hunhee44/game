<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>페널티킥</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #eef2f5;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* 점수판 및 상태 표시 */
        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #444;
        }
        .score-box {
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #1890ff;
            background: #ffffff;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 24px;
        }

        /* 축구 골대 및 6개 조준 구역 프레임 */
        .goal-container {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(2, 100px);
            gap: 12px;
            background-color: #d1d9e6;
            padding: 16px;
            border-radius: 16px;
            border: 6px solid #ffffff; /* 골대 느낌의 흰색 프레임 */
            box-shadow: 
                8px 8px 16px #b8c1ec,
                -8px -8px 16px #ffffff,
                inset 2px 2px 5px rgba(0,0,0,0.1);
            position: relative;
        }

        /* 슛 타겟 버튼 */
        .target-zone {
            background-color: #e0e5ec;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                5px 5px 10px #a3b1c6,
                -5px -5px 10px #ffffff;
            transition: all 0.15s ease;
            user-select: none;
        }

        .target-zone:hover {
            transform: translateY(-2px);
            color: #1890ff;
            box-shadow: 
                6px 6px 12px #a3b1c6,
                -6px -6px 12px #ffffff;
        }

        .target-zone:active {
            transform: translateY(2px);
            box-shadow: 
                inset 3px 3px 6px #a3b1c6,
                inset -3px -3px 6px #ffffff;
        }

        /* 결과 연출 스타일 */
        .target-zone.goal {
            background-color: #e6f7ff;
            color: #52c41a;
        }

        .target-zone.saved {
            background-color: #fff1f0;
            color: #ff4d4f;
        }

        .zone-icon {
            font-size: 1.8rem;
            margin-top: 4px;
        }

        /* 게임 컨트롤 버튼 하단 배치 */
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        #reset-btn {
            background-color: #4caf50;
            box-shadow: 0 5px 0 #388e3c, 0 8px 10px rgba(0,0,0,0.15);
        }

        #reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #388e3c, 0 3px 5px rgba(0,0,0,0.15);
        }

        .home-btn {
            background-color: #1890ff;
            text-decoration: none;
            box-shadow: 0 5px 0 #096dd9, 0 8px 10px rgba(0,0,0,0.15);
            display: inline-block;
        }

        .home-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #096dd9, 0 3px 5px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

    <h1>⚽승부차기 (Penalty Kick)</h1>
    
    <div class="scoreboard">
        <div class="score-box">득점: <span id="goals">0</span></div>
        <div class="score-box">선방: <span id="saves">0</span></div>
        <div class="score-box">시도: <span id="attempts">0</span></div>
    </div>

    <div id="status">슛할 방향을 선택하세요!</div>
    
    <!-- 6개 방향 골대 타겟 -->
    <div class="goal-container" id="goal">
        <button class="target-zone" data-pos="0">
            상단 왼쪽
            <span class="zone-icon">↖️</span>
        </button>
        <button class="target-zone" data-pos="1">
            상단 중간
            <span class="zone-icon">⬆️</span>
        </button>
        <button class="target-zone" data-pos="2">
            상단 오른쪽
            <span class="zone-icon">↗️</span>
        </button>
        <button class="target-zone" data-pos="3">
            하단 왼쪽
            <span class="zone-icon">↙️</span>
        </button>
        <button class="target-zone" data-pos="4">
            하단 중간
            <span class="zone-icon">⬇️</span>
        </button>
        <button class="target-zone" data-pos="5">
            하단 오른쪽
            <span class="zone-icon">↘️</span>
        </button>
    </div>

    <div class="controls">
        <button id="reset-btn" class="btn">점수 초기화</button>
        <a href="index.html" class="btn home-btn">메인으로</a>
    </div>

    <script>
        const targetZones = document.querySelectorAll('.target-zone');
        const statusText = document.getElementById('status');
        const goalsText = document.getElementById('goals');
        const savesText = document.getElementById('saves');
        const attemptsText = document.getElementById('attempts');
        const resetBtn = document.getElementById('reset-btn');

        const posNames = ["상단 왼쪽", "상단 중간", "상단 오른쪽", "하단 왼쪽", "하단 중간", "하단 오른쪽"];

        let goals = 0;
        let saves = 0;
        let attempts = 0;
        let isProcessing = false;

        function shoot(e) {
            if (isProcessing) return;
            isProcessing = true;

            const playerChoice = parseInt(e.currentTarget.getAttribute('data-pos'));
            
            // 골키퍼의 무작위 선택 (0~5 번 위치, 1/6 확률)
            const keeperChoice = Math.floor(Math.random() * 6);

            attempts++;
            clearZoneStyles();

            // 판정 로직
            if (playerChoice === keeperChoice) {
                // 골키퍼 선방
                saves++;
                statusText.textContent = `❌ 선방! 골키퍼가 [${posNames[keeperChoice]}] 방향을 막아냈습니다!`;
                e.currentTarget.classList.add('saved');
                e.currentTarget.querySelector('.zone-icon').textContent = '🧤';
            } else {
                // 골 성공
                goals++;
                statusText.textContent = `⚽ GOAL!! (골키퍼 이동: ${posNames[keeperChoice]})`;
                e.currentTarget.classList.add('goal');
                e.currentTarget.querySelector('.zone-icon').textContent = '⚽';
                
                // 골키퍼가 이동한 위치도 표시
                targetZones[keeperChoice].querySelector('.zone-icon').textContent = '🧤';
            }

            updateScoreboard();

            // 1.5초 후 다음 슛 준비
            setTimeout(() => {
                clearZoneStyles();
                statusText.textContent = "다음 슛 방향을 선택하세요!";
                isProcessing = false;
            }, 1500);
        }

        function clearZoneStyles() {
            const defaultIcons = ['↖️', '⬆️', '↗️', '↙️', '⬇️', '↘️'];
            targetZones.forEach((zone, index) => {
                zone.classList.remove('goal', 'saved');
                zone.querySelector('.zone-icon').textContent = defaultIcons[index];
            });
        }

        function updateScoreboard() {
            goalsText.textContent = goals;
            savesText.textContent = saves;
            attemptsText.textContent = attempts;
        }

        function resetGame() {
            goals = 0;
            saves = 0;
            attempts = 0;
            isProcessing = false;
            updateScoreboard();
            clearZoneStyles();
            statusText.textContent = "슛할 방향을 선택하세요!";
        }

        targetZones.forEach(zone => zone.addEventListener('click', shoot));
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
