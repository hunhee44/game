<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 캐릭터 페널티킥 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #eef2f5;
        }

        h1 {
            color: #333;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #444;
        }
        .score-box {
            background: #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        #status {
            font-size: 1.1rem;
            margin-bottom: 15px;
            font-weight: bold;
            color: #1890ff;
            background: #ffffff;
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            min-height: 24px;
        }

        /* 게임 필드 및 골대 영역 */
        .game-stage {
            position: relative;
            background-color: #d1d9e6;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 
                8px 8px 16px #b8c1ec,
                -8px -8px 16px #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 골대 구조 및 구역 */
        .goal-container {
            display: grid;
            grid-template-columns: repeat(3, 110px);
            grid-template-rows: repeat(2, 100px);
            gap: 12px;
            background-color: #c4d0e0;
            padding: 12px;
            border-radius: 14px;
            border: 6px solid #ffffff;
            position: relative;
        }

        .target-zone {
            background-color: rgba(224, 229, 236, 0.7);
            border: none;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            color: #555;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 
                3px 3px 6px #a3b1c6,
                -3px -3px 6px #ffffff;
            transition: all 0.15s ease;
            user-select: none;
            z-index: 2;
        }

        .target-zone:hover {
            transform: translateY(-2px);
            background-color: #ffffff;
            color: #1890ff;
        }

        .target-zone:active {
            transform: translateY(2px);
        }

        /* 캐릭터 레이어 (골키퍼 & 키커) */
        .character {
            position: absolute;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 10;
        }

        /* 골키퍼 캐릭터 */
        #keeper {
            width: 70px;
            height: 70px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* 키커 캐릭터 & 공 */
        .kicker-area {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        #kicker {
            width: 60px;
            height: 70px;
            transition: transform 0.2s ease;
        }

        #ball {
            width: 35px;
            height: 35px;
            transition: all 0.4s ease-in-out;
            z-index: 15;
        }

        /* 공 날아가는 애니메이션 위치 계산 클래스들 */
        .ball-shoot-0 { transform: translate(-120px, -220px) scale(0.6); }
        .ball-shoot-1 { transform: translate(0px, -220px) scale(0.6); }
        .ball-shoot-2 { transform: translate(120px, -220px) scale(0.6); }
        .ball-shoot-3 { transform: translate(-120px, -110px) scale(0.6); }
        .ball-shoot-4 { transform: translate(0px, -110px) scale(0.6); }
        .ball-shoot-5 { transform: translate(120px, -110px) scale(0.6); }

        /* 골키퍼 이동 위치 클래스들 */
        .keeper-pos-0 { top: 25% !important; left: 20% !important; }
        .keeper-pos-1 { top: 25% !important; left: 50% !important; }
        .keeper-pos-2 { top: 25% !important; left: 80% !important; }
        .keeper-pos-3 { top: 75% !important; left: 20% !important; }
        .keeper-pos-4 { top: 75% !important; left: 50% !important; }
        .keeper-pos-5 { top: 75% !important; left: 80% !important; }

        /* 하단 컨트롤 */
        .controls {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.1s ease;
        }

        #reset-btn {
            background-color: #4caf50;
            box-shadow: 0 5px 0 #388e3c, 0 8px 10px rgba(0,0,0,0.15);
        }

        #reset-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #388e3c;
        }

        .home-btn {
            background-color: #1890ff;
            text-decoration: none;
            box-shadow: 0 5px 0 #096dd9, 0 8px 10px rgba(0,0,0,0.15);
            display: inline-block;
        }

        .home-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #096dd9;
        }
    </style>
</head>
<body>

    <h1>⚽ 캐릭터 승부차기</h1>
    
    <div class="scoreboard">
        <div class="score-box">득점: <span id="goals">0</span></div>
        <div class="score-box">선방: <span id="saves">0</span></div>
        <div class="score-box">시도: <span id="attempts">0</span></div>
    </div>

    <div id="status">골대를 클릭해 슛을 날리세요!</div>
    
    <div class="game-stage">
        <!-- 골대 및 6개 조준선 -->
        <div class="goal-container" id="goal">
            <!-- 골키퍼 SVG 캐릭터 -->
            <div id="keeper" class="character">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <!-- 몸통 -->
                    <circle cx="50" cy="30" r="18" fill="#ffcc80"/> <!-- 얼굴 -->
                    <rect x="35" y="48" width="30" height="35" rx="5" fill="#ff4d4f"/> <!-- 유니폼 -->
                    <!-- 눈 & 미소 -->
                    <circle cx="44" cy="26" r="2.5" fill="#333"/>
                    <circle cx="56" cy="26" r="2.5" fill="#333"/>
                    <path d="M 44 34 Q 50 40 56 34" stroke="#333" stroke-width="2" fill="none"/>
                    <!-- 골키퍼 장갑 -->
                    <circle cx="20" cy="50" r="10" fill="#ffec3d"/>
                    <circle cx="80" cy="50" r="10" fill="#ffec3d"/>
                </svg>
            </div>

            <button class="target-zone" data-pos="0">상단 왼쪽</button>
            <button class="target-zone" data-pos="1">상단 중간</button>
            <button class="target-zone" data-pos="2">상단 오른쪽</button>
            <button class="target-zone" data-pos="3">하단 왼쪽</button>
            <button class="target-zone" data-pos="4">하단 중간</button>
            <button class="target-zone" data-pos="5">하단 오른쪽</button>
        </div>

        <!-- 필드 하단: 키커 & 축구공 -->
        <div class="kicker-area">
            <!-- 키커 SVG 캐릭터 -->
            <div id="kicker">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="40" cy="30" r="18" fill="#ffcc80"/> <!-- 얼굴 -->
                    <rect x="25" y="48" width="30" height="35" rx="5" fill="#1890ff"/> <!-- 유니폼 -->
                    <circle cx="34" cy="26" r="2.5" fill="#333"/>
                    <circle cx="46" cy="26" r="2.5" fill="#333"/>
                    <!-- 축구화 -->
                    <rect x="15" y="83" width="18" height="10" rx="3" fill="#333"/>
                    <rect x="38" y="83" width="18" height="10" rx="3" fill="#333"/>
                </svg>
            </div>

            <!-- 축구공 SVG -->
            <div id="ball">
                <svg viewBox="0 0 100 100" width="100%" height="100%">
                    <circle cx="50" cy="50" r="45" fill="#ffffff" stroke="#333" stroke-width="4"/>
                    <polygon points="50,25 30,40 38,65 62,65 70,40" fill="#333"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="controls">
        <button id="reset-btn" class="btn">점수 초기화</button>
        <a href="index.html" class="btn home-btn">메인으로</a>
    </div>

    <script>
        const targetZones = document.querySelectorAll('.target-zone');
        const statusText = document.getElementById('status');
        const goalsText = document.getElementById('goals');
        const savesText = document.getElementById('saves');
        const attemptsText = document.getElementById('attempts');
        const resetBtn = document.getElementById('reset-btn');
        
        const keeper = document.getElementById('keeper');
        const kicker = document.getElementById('kicker');
        const ball = document.getElementById('ball');

        const posNames = ["상단 왼쪽", "상단 중간", "상단 오른쪽", "하단 왼쪽", "하단 중간", "하단 오른쪽"];

        let goals = 0;
        let saves = 0;
        let attempts = 0;
        let isProcessing = false;

        function shoot(e) {
            if (isProcessing) return;
            isProcessing = true;

            const playerChoice = parseInt(e.currentTarget.getAttribute('data-pos'));
            const keeperChoice = Math.floor(Math.random() * 6);

            attempts++;

            // 1. 키커 모션 (공을 차는 연출)
            kicker.style.transform = "translateX(15px) rotate(10deg)";

            // 2. 공과 골키퍼 이동 애니메이션 적용
            setTimeout(() => {
                ball.className = `ball-shoot-${playerChoice}`;
                keeper.className = `character keeper-pos-${keeperChoice}`;
            }, 100);

            // 3. 판정 연출
            setTimeout(() => {
                if (playerChoice === keeperChoice) {
                    saves++;
                    statusText.textContent = `❌ 선방! 골키퍼가 [${posNames[keeperChoice]}] 방향을 막아냈습니다!`;
                } else {
                    goals++;
                    statusText.textContent = `⚽ GOAL!! (골키퍼 이동: ${posNames[keeperChoice]})`;
                }

                updateScoreboard();

                // 1.8초 후 초기 위치로 복귀
                setTimeout(() => {
                    resetPositions();
                    statusText.textContent = "다음 슛 방향을 선택하세요!";
                    isProcessing = false;
                }, 1800);
            }, 400);
        }

        function resetPositions() {
            ball.className = '';
            keeper.className = 'character';
            kicker.style.transform = 'none';
        }

        function updateScoreboard() {
            goalsText.textContent = goals;
            savesText.textContent = saves;
            attemptsText.textContent = attempts;
        }

        function resetGame() {
            goals = 0;
            saves = 0;
            attempts = 0;
            isProcessing = false;
            updateScoreboard();
            resetPositions();
            statusText.textContent = "골대를 클릭해 슛을 날리세요!";
        }

        targetZones.forEach(zone => zone.addEventListener('click', shoot));
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
