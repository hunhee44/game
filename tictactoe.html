<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2인용 틱택토 게임</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
            font-weight: bold;
            color: #555;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 5px;
        }
        .cell {
            width: 100px;
            height: 100px;
            background-color: #fff;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 2.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .cell:hover {
            background-color: #e8f0fe;
        }
        .cell.X { color: #ff4d4f; }
        .cell.O { color: #1890ff; }
        #reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #reset-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h1>틱택토 (Tic-Tac-Toe)</h1>
    <div id="status">턴: 플레이어 X</div>
    
    <div class="board" id="board">
        <div class="cell" data-index="0"></div>
        <div class="cell" data-index="1"></div>
        <div class="cell" data-index="2"></div>
        <div class="cell" data-index="3"></div>
        <div class="cell" data-index="4"></div>
        <div class="cell" data-index="5"></div>
        <div class="cell" data-index="6"></div>
        <div class="cell" data-index="7"></div>
        <div class="cell" data-index="8"></div>
    </div>

    <button id="reset-btn">게임 초기화</button>

    <script>
        const board = document.getElementById('board');
        const cells = document.querySelectorAll('.cell');
        const statusText = document.getElementById('status');
        const resetBtn = document.getElementById('reset-btn');

        let currentPlayer = 'X';
        let gameState = ["", "", "", "", "", "", "", "", ""];
        let isGameActive = true;

        // 승리 조건 배열 (3목이 완성되는 모든 경우의 수의 인덱스)
        const winningConditions = [, [3, 4, 5], [6, 7, 8], // 가로, [1, 4, 7], [2, 5, 8], // 세로, [2, 4, 6]             // 대각선
        ];

        // 클릭 이벤트 처리
        function handleCellClick(e) {
            const clickedCell = e.target;
            const clickedCellIndex = parseInt(clickedCell.getAttribute('data-index'));

            // 이미 채워져 있거나 게임이 끝났다면 무시
            if (gameState[clickedCellIndex] !== "" || !isGameActive) {
                return;
            }

            // 데이터 업데이트 및 UI 반영
            gameState[clickedCellIndex] = currentPlayer;
            clickedCell.textContent = currentPlayer;
            clickedCell.classList.add(currentPlayer);

            checkResult();
        }

        // 승리 및 무승부 판정
        function checkResult() {
            let roundWon = false;

            for (let i = 0; i < winningConditions.length; i++) {
                const [a, b, c] = winningConditions[i];
                if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                    roundWon = true;
                    break;
                }
            }

            if (roundWon) {
                statusText.textContent = `축하합니다! 플레이어 ${currentPlayer}의 승리!`;
                isGameActive = false;
                return;
            }

            // 모든 칸이 찼는데 승자가 없는 경우 (무승부)
            if (!gameState.includes("")) {
                statusText.textContent = "무승부입니다!";
                isGameActive = false;
                return;
            }

            // 정상적으로 턴 전환 (X였으면 O로, O였으면 X로)
            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            statusText.textContent = `턴: 플레이어 ${currentPlayer}`;
        }

        // 게임 리셋
        function resetGame() {
            currentPlayer = 'X';
            gameState = ["", "", "", "", "", "", "", "", ""];
            isGameActive = true;
            statusText.textContent = `턴: 플레이어 ${currentPlayer}`;
            cells.forEach(cell => {
                cell.textContent = "";
                cell.classList.remove('X', 'O');
            });
        }

        // 이벤트 리스너 연결
        cells.forEach(cell => cell.addEventListener('click', handleCellClick));
        resetBtn.addEventListener('click', resetGame);
    </script>
</body>
</html>
